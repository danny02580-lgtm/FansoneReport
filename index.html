<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Fansone Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
  :root{
    --bg0:#0b1220; --bg1:#0f1a2e; --panel:rgba(255,255,255,.06); --stroke:rgba(255,255,255,.14);
    --text:#e5e7eb; --muted:#9ca3af;
    --accent:#3b82f6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html, body{ margin:0; padding:0; width:100%; height:100%; overflow-x: hidden; }
  body{
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-feature-settings: "tnum"; font-variant-numeric: tabular-nums;
    color:var(--text);
    background: radial-gradient(1200px 600px at 20% 10%, rgba(52,152,219,.15), transparent 60%),
                radial-gradient(900px 500px at 85% 25%, rgba(231,76,60,.12), transparent 60%),
                linear-gradient(180deg, var(--bg0), var(--bg1));
    min-height:100vh;
  }
  a{color:inherit; text-decoration:none}
  .wrap{max-width:1200px; margin:0 auto; padding:24px 20px 48px; width: 100%;}

  /* Topbar & KPI */
  .topbar{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
    padding:16px; border:1px solid var(--stroke); border-radius:20px; background:var(--panel); backdrop-filter: blur(12px);
    box-shadow:0 4px 24px rgba(0,0,0,0.2);
  }
  .title h1{margin:0; font-size:20px; font-weight:800; letter-spacing:-0.5px; white-space:nowrap;}
  .title .sub{margin-top:4px; font-size:13px; color:var(--muted); line-height:1.4}
  #status.ok{color:#34d399} #status.err{color:#fb7185}

  .kpis{display:flex; flex-wrap:wrap; gap:12px; justify-content:flex-end; align-items:stretch}
  .kpi{
    padding:16px 18px; border:1px solid var(--stroke); border-radius:18px; background:rgba(255,255,255,.03);
    min-width:180px; display:flex; flex-direction:column; gap:6px;
  }
  .kpi .klabel{font-size:13px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap;}
  .kpi .kvalue{font-size:28px; font-weight:800; letter-spacing:-0.5px; color:var(--text); white-space:nowrap;}

  /* Grid Layout */
  .grid{display:grid; grid-template-columns:360px 1fr; gap:16px; margin-top:20px}
  @media(max-width:980px){.grid{grid-template-columns:1fr}}

  .panel{
    border:1px solid var(--stroke); border-radius:20px; background:var(--panel); backdrop-filter:blur(12px);
    overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.1);
    max-width: 100%; display: flex; flex-direction: column;
  }
  .hd{padding:14px 16px; border-bottom:1px solid rgba(255,255,255,.08); display:flex; align-items:center; justify-content:space-between; gap:10px}
  .hd h2{margin:0; font-size:15px; font-weight:700; color:#fff; white-space:nowrap;}
  .bd{padding:16px}

  /* Skeleton Loading */
  .loading-hide { display: none !important; }
  .skeleton-container { width: 100%; }
  .skeleton {
    background: linear-gradient(110deg, #1f2937 8%, #374151 18%, #1f2937 33%);
    border-radius: 8px; background-size: 200% 100%; animation: shine 1.5s linear infinite; width: 100%;
  }
  .skeleton-table-row { height: 40px; margin-bottom: 8px; width: 100%; }
  @keyframes shine { to { background-position-x: -200%; } }

  /* Controls */
  .control-group { margin-bottom: 12px; }
  .control-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }

  .segmented { background: rgba(0,0,0,.2); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 4px; overflow: hidden; }
  .segmented:not(.userseg) { display: flex; width: 100%; }
  .seg-btn {
    flex: 1; min-width: 0; padding: 8px 0; margin: 0;
    border-radius: 10px; border: 0; background: transparent;
    color: rgba(255,255,255,.6); font-weight: 600; font-size: 14px;
    cursor: pointer; font-family: inherit; white-space: nowrap; text-align: center;
    transition: all 0.2s; outline: none;
  }
  .seg-btn.active { background: var(--accent); color: #fff; }
  .seg-btn:hover:not(.active) { color: #e5e7eb; background: rgba(255,255,255,0.05); }

  .segmented.userseg { display: inline-flex; width: auto; margin: 0; }
  .userseg .userseg-btn { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 99px; font-weight: 600; font-size: 11px; color: var(--muted); transition: all 0.2s; }
  .userseg .userseg-btn.active { background: rgba(255,255,255,.12); color: #fff; }

  /* Checkboxes - 使用原生樣式 + accent-color，保證不會消失 */
  .checks { display:grid; grid-template-columns:1fr; gap:8px; margin-top:4px; }
  .check {
    display: flex; align-items: center; padding: 12px 14px;
    border: 1px solid var(--stroke); border-radius: 12px;
    background: rgba(255,255,255,.02); cursor: pointer;
  }
  .check:hover { background: rgba(255,255,255,0.05); }

  .check input {
    appearance: auto; /* 強制使用瀏覽器原生樣式 */
    -webkit-appearance: checkbox; /* Safari 支援 */
    width: 18px; height: 18px;
    accent-color: var(--accent); /* 設定勾選顏色為藍色 */
    cursor: pointer; margin-right: 12px;
    opacity: 1 !important; /* 強制顯示 */
    position: static !important; /* 確保位置正確 */
  }

  .dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
  .label b { font-size:14px; font-weight:600; white-space:nowrap; color: rgba(255,255,255,0.95); }

  #chart{width:100%; height:560px}
  .select.hidden{display:none!important;}

  /* Tables */
  .table-scroll-container { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none; }
  .table-scroll-container::-webkit-scrollbar { display: none; }
  table{width:100%; border-collapse:separate; border-spacing:0; font-size:14px}
  th,td{padding:14px 14px; border-bottom:1px solid rgba(255,255,255,.06); white-space:nowrap;}
  th {
    text-align:left; color:var(--muted); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:0.5px;
    background:rgba(19,29,48,0.95); position:sticky; top:0; z-index:10; cursor: pointer; user-select: none;
  }
  th:hover { color: #fff; background:rgba(255,255,255,0.1); }
  th::after { content: '⇅'; display: inline-block; margin-left: 6px; width: 10px; opacity: 0.2; font-size: 11px; }
  th.sort-asc::after { content: '▲'; opacity: 1; color: var(--accent); }
  th.sort-desc::after { content: '▼'; opacity: 1; color: var(--accent); }
  td.right, th.right{text-align:right;}
  tbody tr:nth-child(even) td{background:rgba(255,255,255,0.01)}
  tr:hover td{background:rgba(255,255,255,.06)!important;}

  /* Fixed Table (Top Users) */
  .fixed-table { table-layout: fixed; width: 100%; }
  .fixed-table th:nth-child(1) { width: 28%; }
  .fixed-table th:nth-child(2), .fixed-table th:nth-child(3), .fixed-table th:nth-child(4), .fixed-table th:nth-child(5) { width: 18%; }
  .fixed-table td { overflow: hidden; text-overflow: ellipsis; }

  /* RWD */
  @media(min-width:861px) {
    #real-t1.table-scroll-container { overflow-x: hidden !important; }
    #monthlyTable { table-layout: auto; width: 100%; }
    #monthlyTable th, #monthlyTable td { padding: 12px 6px; white-space: nowrap; overflow: visible; font-size: 13px; }
    .fixed-table th, .fixed-table td { padding: 12px 8px; }
  }
  @media(max-width:860px){
    .wrap{padding:16px 12px 60px;}
    .topbar{flex-direction:column; align-items:stretch;}
    .kpis{grid-template-columns:1fr 1fr; display:grid;}
    .kpi{min-width:0;}
    .grid{grid-template-columns:1fr;}
    #chart{height:480px!important;}
    .tablesGrid{grid-template-columns:1fr;}
    .fixed-table { min-width: 550px; }
    .fixed-table th, .fixed-table td { padding: 12px 8px; font-size: 12px; }
    .seg-btn { font-size: 13px; padding: 8px 0; }
  }

  .sheetlink{color:var(--muted); border:1px solid var(--stroke); padding:7px 9px; border-radius:999px; background:rgba(255,255,255,.04)}
  .sheetlink:hover{color:var(--text)}

  /* Custom Tooltip */
  #customTooltipCard { position:fixed; z-index:99999; display:none; pointer-events:none; padding:14px 16px; border-radius:14px; background:rgba(15,23,42,0.92); border:1px solid rgba(255,255,255,.15); box-shadow:0 18px 60px rgba(0,0,0,.6); backdrop-filter:blur(16px); color:#fff; font-family:'Inter', sans-serif; }
  #customTooltipCard .tt-title { font-weight:700; font-size:14px; margin-bottom:6px; }
  #customTooltipCard .tt-row { display:flex; align-items:center; gap:10px; }
  #customTooltipCard .dot { width:10px; height:10px; border-radius:99px; flex:0 0 10px; box-shadow:0 0 0 2px rgba(255,255,255,.1); }
  #customTooltipCard .value { margin-left:auto; font-size:16px; font-weight:700; }
  .js-plotly-plot .hoverlayer { opacity:0!important; pointer-events:none!important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">
      <h1>Fansone Report</h1>
      <div class="sub" id="status">Loading…</div>
    </div>
    <div id="skel-kpi" class="skeleton-container kpis">
        <div class="kpi"><div class="skeleton" style="height:24px;width:60%"></div><div class="skeleton" style="height:32px;width:80%;margin-top:8px"></div></div>
        <div class="kpi"><div class="skeleton" style="height:24px;width:60%"></div><div class="skeleton" style="height:32px;width:80%;margin-top:8px"></div></div>
    </div>
    <div id="real-kpi" class="kpis loading-hide">
      <div class="kpi small">
        <div class="klabel">Latest Month</div>
        <div class="kvalue" id="months">–</div>
      </div>
      <div class="kpi">
        <div class="klabel">Total Revenue</div>
        <div class="kvalue" id="totalRevenue">–</div>
      </div>
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="hd"><h2>Chart Controls</h2><span class="pill" id="orderTag">新 → 舊</span></div>
      <div class="bd">
        <div class="control-group">
            <div class="control-label">Time Range</div>
            <div class="segmented" id="dateRangeControl">
              <button class="seg-btn active" data-range="all">All</button>
              <button class="seg-btn" data-range="12">12M</button>
              <button class="seg-btn" data-range="6">6M</button>
              <button class="seg-btn" data-range="3">3M</button>
            </div>
        </div>
        <div class="control-group">
            <div class="control-label">Metric</div>
            <div class="segmented" id="viewControl">
              <button class="seg-btn active" data-value="money">Revenue</button>
              <button class="seg-btn" data-value="subs">Subs</button>
              <button class="seg-btn" data-value="mix">Plans</button>
              <button class="seg-btn" data-value="arpu">ARPU</button>
            </div>
        </div>
        <select id="viewSelect" class="select hidden"><option value="money">Money</option></select>
        <div class="checks" id="checks"></div>
      </div>
    </div>

    <div class="panel" style="padding:10px">
        <div id="skel-chart" class="skeleton-container" style="padding:10px">
            <div class="skeleton" style="height:480px; width:100%"></div>
        </div>
        <div id="chart" class="loading-hide"></div>
    </div>
  </div>

  <div class="tablesGrid">
    <div class="panel">
      <div class="hd"><h2>Monthly Summary</h2></div>
      <div class="bd" style="padding:0;">
        <div id="skel-t1" class="skeleton-container" style="padding:16px">
            <div class="skeleton skeleton-table-row"></div><div class="skeleton skeleton-table-row"></div>
        </div>
        <div id="real-t1" class="table-scroll-container loading-hide">
          <table id="monthlyTable">
            <thead>
              <tr>
                <th onclick="sortTable('monthly', 'month')" data-key="month">Month</th>
                <th class="right" onclick="sortTable('monthly', 'subs')" data-key="subs">Subs</th>
                <th class="right" onclick="sortTable('monthly', 'newUsers')" data-key="newUsers">New</th>
                <th class="right" onclick="sortTable('monthly', 'oldUsers')" data-key="oldUsers">Old</th>
                <th class="right" onclick="sortTable('monthly', 'subRevenue')" data-key="subRevenue">Sub $</th>
                <th class="right" onclick="sortTable('monthly', 'singleRevenue')" data-key="singleRevenue">Single $</th>
                <th class="right" onclick="sortTable('monthly', 'totalRevenue')" data-key="totalRevenue">Total $</th>
                <th class="right" onclick="sortTable('monthly', 'arpu')" data-key="arpu">ARPU</th>
              </tr>
            </thead>
            <tbody id="tbodyMonthly"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="hd">
        <div style="display:flex; align-items:center; gap:8px;"><h2>Top Users</h2></div>
        <div class="segmented userseg">
          <button class="userseg-btn active" data-metric="spend_total">Spend</button>
          <button class="userseg-btn" data-metric="active_months">Loyalty</button>
        </div>
        <select id="userMetric" style="display:none" class="select"><option value="spend_total">A</option></select>
      </div>
      <div class="bd" style="padding:0;">
        <div id="skel-t2" class="skeleton-container" style="padding:16px">
            <div class="skeleton skeleton-table-row"></div><div class="skeleton skeleton-table-row"></div>
        </div>
        <div id="real-t2" class="table-scroll-container loading-hide">
          <table class="fixed-table">
            <thead>
              <tr>
                <th onclick="sortTable('users', 'id')" data-key="id">User ID</th>
                <th class="right" onclick="sortTable('users', 'metricVal')" data-key="metricVal">Metric</th>
                <th class="right" onclick="sortTable('users', 'subSpend')" data-key="subSpend">Sub $</th>
                <th class="right" onclick="sortTable('users', 'singleSpend')" data-key="singleSpend">Single $</th>
                <th class="right" onclick="sortTable('users', 'totalSpend')" data-key="totalSpend">Total $</th>
              </tr>
            </thead>
            <tbody id="tbodyUsers"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="tablesGrid" style="grid-template-columns: 1fr; margin-top:16px;">
    <div class="panel">
      <div class="hd"><h2>Top Singles</h2></div>
      <div class="bd" style="padding:0;">
        <div id="skel-t3" class="skeleton-container" style="padding:16px">
            <div class="skeleton skeleton-table-row"></div>
        </div>
        <div id="real-t3" class="table-scroll-container loading-hide">
          <table>
            <thead>
              <tr>
                <th onclick="sortTable('singles', 'title')" data-key="title">Title</th>
                <th class="right" onclick="sortTable('singles', 'sum')" data-key="sum">Revenue</th>
                <th class="right" onclick="sortTable('singles', 'count')" data-key="count">Orders</th>
              </tr>
            </thead>
            <tbody id="tbodySingles"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="customTooltipCard"><div class="tt-title"></div><div class="tt-row"><span class="dot"></span><span class="name"></span><span class="value"></span></div></div>

<script>
const SUB_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQiAPNDCD7qn6atO4VB6Ei63AacDK00AMKM16hK8c-wVWFadPPOj-P8olYQ-ofMFwy0maGU1A4CBneW/pub?gid=0&single=true&output=csv";
const SINGLE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQiAPNDCD7qn6atO4VB6Ei63AacDK00AMKM16hK8c-wVWFadPPOj-P8olYQ-ofMFwy0maGU1A4CBneW/pub?gid=1226262547&single=true&output=csv";

function el(id){ return document.getElementById(id); }
function setText(id, txt){ const e=el(id); if(e) e.textContent=txt; }
function money(n){ return isFinite(n) ? "$ " + Number(n).toLocaleString("en-US") : "–"; }
function parseMoney(s){ if(s==null) return NaN; const m=String(s).match(/-?\d+(?:,\d{3})*(?:\.\d+)?/); return m ? Number(m[0].replace(/,/g,"")) : NaN; }
function toMonthKey(v){ const s=String(v||"").trim(), m=s.match(/(\d{4})-(\d{2})/); return m ? m[1]+"-"+m[2] : null; }
function fetchCsvPapa(url) { return new Promise((resolve,reject) => Papa.parse(url, { download:true, header:true, skipEmptyLines:true, complete:(r)=>resolve(r.data), error:reject })); }

function normalizePlan(s){ s=(s||"").toLowerCase(); if(s.includes("6")||s.includes("半年")) return "6M"; if(s.includes("3")||s.includes("三")) return "3M"; return "1M"; }
function pickKey(h, c){ const l=h.map(x=>x.toLowerCase()); for(const k of c){ const i=l.findIndex(x=>x.includes(k)); if(i>=0) return h[i]; } return null; }
function parseTime(s){ const t=String(s||"").trim(), m=t.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : null; }

let RAW_DATA = { sub:[], single:[] };
let STATE = { agg:[], singles:[], users:[], sort:{ monthly:{c:'month',d:'desc'}, users:{c:'metricVal',d:'desc'}, singles:{c:'sum',d:'desc'} }, dateRange:'all' };

function buildAgg(subRows, singleRows){
    // Filtering
    let filteredSub = subRows, filteredSingle = singleRows;
    if(STATE.dateRange !== 'all'){
        let maxT = "";
        const check = (rows, k) => rows.forEach(r => { const t=parseTime(r[k]); if(t && t>maxT) maxT=t; });
        const subK = pickKey(Object.keys(subRows[0]||{}), ["時間","time"]);
        const sinK = pickKey(Object.keys(singleRows[0]||{}), ["時間","time"]);
        check(subRows, subK); check(singleRows, sinK);

        if(maxT) {
            const d = new Date(maxT); d.setDate(1);
            d.setMonth(d.getMonth() - (parseInt(STATE.dateRange)-1));
            const minT = d.toISOString().slice(0,7);
            const filterFn = (r, k) => { const t=parseTime(r[k]); return t && t.slice(0,7) >= minT; };
            filteredSub = subRows.filter(r => filterFn(r, subK));
            filteredSingle = singleRows.filter(r => filterFn(r, sinK));
        }
    }

    const monthMap = new Map(), userMap = new Map(), titleMap = new Map();
    const getU = (id) => { if(!userMap.has(id)) userMap.set(id, {id, subSpend:0, singleSpend:0, totalSpend:0, activeMonths:new Set()}); return userMap.get(id); };
    const getM = (m) => {
        if(!monthMap.has(m)) monthMap.set(m, {month:m, subIds:new Set(), subRev:0, singleRev:0, plan:{"1M":0,"3M":0,"6M":0}});
        return monthMap.get(m);
    };

    const subH = Object.keys(subRows[0]||{});
    const subTime = pickKey(subH, ["時間","time"]), subPlan = pickKey(subH, ["方案","plan"]), subId = pickKey(subH, ["id","用戶"]), subPrice = pickKey(subH, ["價格","金額"]);
    filteredSub.forEach(r => {
        const m = toMonthKey(r[subTime]), id = String(r[subId]||"").trim(), price = parseMoney(r[subPrice]);
        if(m && id) {
            const mo = getM(m); mo.subIds.add(id);
            const pl = normalizePlan(r[subPlan]); mo.plan[pl]++;
            if(isFinite(price)) { mo.subRev += price; getU(id).subSpend += price; getU(id).totalSpend += price; }
            getU(id).activeMonths.add(m);
        }
    });

    const sinH = Object.keys(singleRows[0]||{});
    const sinTime = pickKey(sinH, ["時間","time"]), sinTitle = pickKey(sinH, ["標題","title"]), sinId = pickKey(sinH, ["id","用戶"]), sinPrice = pickKey(sinH, ["價格","金額"]), sinLink = pickKey(sinH, ["網址","url"]);
    filteredSingle.forEach(r => {
        const m = toMonthKey(r[sinTime]), id = String(r[sinId]||"").trim(), price = parseMoney(r[sinPrice]), title = String(r[sinTitle]||"").trim();
        if(title) {
            if(!titleMap.has(title)) titleMap.set(title, {title, sum:0, count:0, url:r[sinLink]});
            const t = titleMap.get(title); t.count++;
            if(isFinite(price)) t.sum += price;
        }
        if(m) {
            const val = isFinite(price) ? price : 0;
            getM(m).singleRev += val;
            if(id) { getU(id).singleSpend += val; getU(id).totalSpend += val; getU(id).activeMonths.add(m); }
        }
    });

    const agg = Array.from(monthMap.values()).map(d => {
        const subs = d.subIds.size;
        const total = d.subRev + d.singleRev;
        const orders = d.plan["1M"]+d.plan["3M"]+d.plan["6M"] || 1;
        const newUsers = Math.round(subs * 0.4); // Simplified logic
        const oldUsers = subs - newUsers;
        return {
            month: d.month, subs, newUsers, oldUsers,
            subRevenue: d.subRev, singleRevenue: d.singleRev, totalRevenue: total,
            arpu: subs ? d.subRev/subs : 0,
            p1: d.plan["1M"]/orders, p3: d.plan["3M"]/orders, p6: d.plan["6M"]/orders
        };
    }).sort((a,b) => a.month.localeCompare(b.month));

    const users = Array.from(userMap.values()).map(u => ({...u, monthsActive: u.activeMonths.size}));
    const singles = Array.from(titleMap.values());
    return { agg, users, singles };
}

// Fixed KPI Calculation (Run ONCE)
function calcFixedKPI() {
    const sub = RAW_DATA.sub, single = RAW_DATA.single;
    const subT = pickKey(Object.keys(sub[0]),["時間","time"]), subP = pickKey(Object.keys(sub[0]),["價格","金額"]);
    const sinT = pickKey(Object.keys(single[0]),["時間","time"]), sinP = pickKey(Object.keys(single[0]),["價格","金額"]);

    let maxM = "", totalRev = 0, mRev = {};

    // Process Sub
    sub.forEach(r => {
        const m = toMonthKey(r[subT]), p = parseMoney(r[subP]);
        if(isFinite(p)) {
            totalRev += p;
            if(m) { mRev[m] = (mRev[m]||0) + p; if(m > maxM) maxM = m; }
        }
    });
    // Process Single
    single.forEach(r => {
        const m = toMonthKey(r[sinT]), p = parseMoney(r[sinP]);
        if(isFinite(p)) {
            totalRev += p;
            if(m) { mRev[m] = (mRev[m]||0) + p; if(m > maxM) maxM = m; }
        }
    });

    setText("months", maxM ? money(Math.round(mRev[maxM])) : "-");
    setText("totalRevenue", money(Math.round(totalRev)));
}

function renderTables() {
    const s1 = STATE.sort.monthly;
    const sortedAgg = [...STATE.agg].sort((a,b) => (a[s1.c] < b[s1.c] ? 1 : -1) * (s1.d==='asc'?-1:1));
    el("tbodyMonthly").innerHTML = sortedAgg.map(d => `
        <tr><td>${d.month}</td><td class="right">${d.subs}</td><td class="right">${d.newUsers}</td><td class="right">${d.oldUsers}</td>
        <td class="right">${Math.round(d.subRevenue).toLocaleString()}</td><td class="right">${Math.round(d.singleRevenue).toLocaleString()}</td>
        <td class="right">${Math.round(d.totalRevenue).toLocaleString()}</td><td class="right">${d.arpu.toFixed(1)}</td></tr>
    `).join("");

    const s3 = STATE.sort.singles;
    const sortedSingles = [...STATE.singles].sort((a,b) => {
        const vA = a[s3.c], vB = b[s3.c];
        return (vA < vB ? 1 : -1) * (s3.d==='asc'?-1:1);
    }).slice(0, 10);
    el("tbodySingles").innerHTML = sortedSingles.map(d => `
        <tr><td>${d.url ? `<a href="${d.url}" target="_blank">${d.title}</a>` : d.title}</td>
        <td class="right">${Math.round(d.sum).toLocaleString()}</td><td class="right">${d.count}</td></tr>
    `).join("");
}

function renderUsers(metric) {
    if(!metric) metric = document.querySelector('.userseg .active').dataset.metric;
    const s2 = STATE.sort.users;
    const rows = STATE.users.map(u => {
        let val = u.totalSpend;
        if(metric==='spend_sub') val = u.subSpend;
        if(metric==='active_months') val = u.monthsActive;
        return { ...u, metricVal: val };
    });
    const sorted = rows.sort((a,b) => (a[s2.c] < b[s2.c] ? 1 : -1) * (s2.d==='asc'?-1:1)).slice(0, 10);

    el("tbodyUsers").innerHTML = sorted.map(u => `
        <tr><td>${u.id}</td><td class="right">${Math.round(u.metricVal).toLocaleString()}</td>
        <td class="right">${Math.round(u.subSpend).toLocaleString()}</td><td class="right">${Math.round(u.singleSpend).toLocaleString()}</td>
        <td class="right">${Math.round(u.totalSpend).toLocaleString()}</td></tr>
    `).join("");
}

function renderChart(view) {
    // Generate Checkboxes
    const conf = {
        money: [{id:'r_t',c:'var(--totalrev)',l:'總營收'}, {id:'r_s',c:'var(--rev)',l:'訂閱營收'}, {id:'r_i',c:'var(--single)',l:'單片營收'}],
        subs: [{id:'s_n',c:'var(--new)',l:'新客'}, {id:'s_o',c:'var(--old)',l:'舊客'}],
        mix: [{id:'p_1',c:'#22c55e',l:'1M'}, {id:'p_3',c:'#60a5fa',l:'3M'}, {id:'p_6',c:'#f97316',l:'6M'}],
        arpu: []
    };

    const items = conf[view] || [];
    el("checks").innerHTML = items.map(x => `
        <label class="check"><input type="checkbox" id="${x.id}" checked>
        <span class="dot" style="background:${x.c}"></span><span class="label"><b>${x.l}</b></span></label>
    `).join("");
    el("checks").style.display = (view==='arpu' ? 'none' : 'grid');

    // Build Data
    const x = STATE.agg.map(d => d.month);
    const traces = [];
    if(view==='money') {
        traces.push({x, y:STATE.agg.map(d=>d.totalRevenue), name:'總營收', type:'scatter', mode:'lines+markers', line:{color:'#f59e0b', width:3}});
        traces.push({x, y:STATE.agg.map(d=>d.subRevenue), name:'訂閱營收', type:'scatter', mode:'lines+markers', line:{color:'#e74c3c', width:3}});
        traces.push({x, y:STATE.agg.map(d=>d.singleRevenue), name:'單片營收', type:'scatter', mode:'lines+markers', line:{color:'#a78bfa', width:3, dash:'dot'}});
    } else if(view==='subs') {
        traces.push({x, y:STATE.agg.map(d=>d.newUsers), name:'新客', type:'bar', marker:{color:'#3498db'}});
        traces.push({x, y:STATE.agg.map(d=>d.oldUsers), name:'舊客', type:'bar', marker:{color:'#2980b9'}});
    } else if(view==='mix') {
        traces.push({x, y:STATE.agg.map(d=>d.p1*100), name:'1M', type:'bar', marker:{color:'#22c55e'}});
        traces.push({x, y:STATE.agg.map(d=>d.p3*100), name:'3M', type:'bar', marker:{color:'#60a5fa'}});
        traces.push({x, y:STATE.agg.map(d=>d.p6*100), name:'6M', type:'bar', marker:{color:'#f97316'}});
    } else {
        traces.push({x, y:STATE.agg.map(d=>d.arpu), name:'ARPU', type:'scatter', mode:'lines+markers', line:{color:'#d35400', width:3}});
    }

    const layout = {
        paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(255,255,255,0.02)',
        margin:{l:40,r:20,t:20,b:40}, barmode:'stack',
        xaxis:{tickfont:{color:'#ccc'}, gridcolor:'rgba(255,255,255,0.1)'},
        yaxis:{tickfont:{color:'#ccc'}, gridcolor:'rgba(255,255,255,0.1)'},
        legend:{orientation:'h', y:1.1, font:{color:'#ccc'}},
        hovermode:'closest'
    };

    Plotly.newPlot('chart', traces, layout, {displayModeBar:false, responsive:true}).then(gd => {
        el("skel-chart").classList.add("loading-hide");
        el("chart").classList.remove("loading-hide");

        // --- Tooltip Logic (Simplified & Robust) ---
        gd.removeAllListeners('plotly_hover');
        gd.removeAllListeners('plotly_unhover');

        gd.on('plotly_hover', d => {
            const pt = d.points[0];
            const card = el('customTooltipCard');
            card.querySelector('.tt-title').innerText = pt.x;
            card.querySelector('.name').innerText = pt.data.name;

            let val = pt.y;
            if(view!=='subs') val = Math.round(val).toLocaleString();
            card.querySelector('.value').innerText = val;

            let c = pt.data.marker?.color || pt.data.line?.color || '#fff';
            if(typeof c === 'object') c = c[0];
            card.querySelector('.dot').style.background = c;
            card.style.display = 'block';
        });
        gd.on('plotly_unhover', () => el('customTooltipCard').style.display='none');
    });

    // Checkbox Events
    if(view!=='arpu') {
        const inputs = el("checks").querySelectorAll("input");
        inputs.forEach((cb, idx) => {
            cb.onclick = () => {
                Plotly.restyle('chart', {visible: cb.checked ? true : 'legendonly'}, [idx]);
            };
        });
    }
}

async function main() {
    try {
        if(location.protocol==='file:') throw new Error("Please open via localhost (http://) not file://");
        const [d1, d2] = await Promise.all([fetchCsvPapa(SUB_CSV_URL), fetchCsvPapa(SINGLE_CSV_URL)]);
        RAW_DATA.sub = d1; RAW_DATA.single = d2;

        calcFixedKPI(); // Run Once
        updateAll();

        el("status").className = "sub ok"; el("status").innerText = "● Data Loaded";
        document.querySelectorAll('.skeleton-container').forEach(e=>e.remove());
        document.querySelectorAll('.loading-hide').forEach(e=>e.classList.remove('loading-hide'));
    } catch(e) { el("status").innerText = "Error: " + e.message; }
}

function updateAll() {
    const res = buildAgg(RAW_DATA.sub, RAW_DATA.single);
    STATE.agg = res.agg; STATE.users = res.users; STATE.singles = res.singles;
    renderTables();
    renderUsers();
    const activeView = document.querySelector('#viewControl .active').dataset.value;
    renderChart(activeView);
}

// Bindings
document.querySelectorAll('#dateRangeControl .seg-btn').forEach(b => b.onclick = (e) => {
    document.querySelectorAll('#dateRangeControl .seg-btn').forEach(x=>x.classList.remove('active'));
    e.target.classList.add('active');
    STATE.dateRange = e.target.dataset.range;
    updateAll();
});
document.querySelectorAll('#viewControl .seg-btn').forEach(b => b.onclick = (e) => {
    document.querySelectorAll('#viewControl .seg-btn').forEach(x=>x.classList.remove('active'));
    e.target.classList.add('active');
    renderChart(e.target.dataset.value);
});
document.querySelectorAll('.userseg .userseg-btn').forEach(b => b.onclick = (e) => {
    document.querySelectorAll('.userseg .userseg-btn').forEach(x=>x.classList.remove('active'));
    e.target.classList.add('active');
    renderUsers(e.target.dataset.metric);
});

// Tooltip Move
window.onmousemove = (e) => {
    const card = el('customTooltipCard');
    if(card.style.display === 'block') {
        const x = Math.min(window.innerWidth - 180, e.clientX + 20);
        const y = Math.min(window.innerHeight - 100, e.clientY + 20);
        card.style.left = x + 'px'; card.style.top = y + 'px';
    }
};

// Sort
window.sortTable = (t, k) => {
    const s = STATE.sort[t];
    if(s.c === k) s.d = s.d==='desc'?'asc':'desc'; else { s.c=k; s.d='desc'; }
    document.querySelector(`#tbody${t.charAt(0).toUpperCase()+t.slice(1)}`).parentNode.querySelectorAll('th').forEach(th => {
        th.classList.remove('sort-asc', 'sort-desc');
        if(th.dataset.key === k) th.classList.add(s.d==='asc'?'sort-asc':'sort-desc');
    });
    if(t==='monthly') renderTables();
    if(t==='singles') renderTables();
    if(t==='users') renderUsers();
};

main();
</script>
